name: Publish Packages

on:
  release:
    types: [published]

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): npm verifies this workflow's identity directly,
    # so no long-lived token is needed. Requires npm >= 11.5.1 / Node >= 22.14 and
    # a Trusted Publisher on npmjs.com (orchstep / orchstep / publish-packages.yml).
    # Provenance attestations are generated automatically for this public repo.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: Update version from release tag
        working-directory: npm
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version $VERSION --no-git-tag-version --allow-same-version
      - name: Publish
        working-directory: npm
        # OIDC only: no NPM_TOKEN. Validated by v0.15.2 (signed provenance).
        run: npm publish --access public

  publish-pip:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install build twine
      - name: Update version from release tag
        working-directory: pip
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/version = .*/version = \"$VERSION\"/" pyproject.toml
      - name: Build
        working-directory: pip
        run: python -m build --sdist --wheel
      - name: Publish
        working-directory: pip
        run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    # Lists the OrchStep MCP server (built into the binary, run via `npx orchstep
    # mcp serve`) in the official registry, which PulseMCP, Glama and others copy.
    # Ownership: "mcpName" in npm/package.json must equal server.json "name", and
    # the registry checks the PUBLISHED npm package, so this runs after npm.
    # Login: GitHub OIDC for the io.github.orchstep namespace; no secrets.
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@v4
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Set version from release tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          cat server.json
      - name: Wait for npm to serve the new version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          for i in $(seq 1 30); do
            npm view "orchstep@$VERSION" mcpName 2>/dev/null | grep -q orchstep && exit 0
            sleep 10
          done
          echo "npm never served orchstep@$VERSION with mcpName"; exit 1
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
