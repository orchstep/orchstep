name: Publish Packages

on:
  release:
    types: [published]

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): npm verifies this workflow's identity directly,
    # so no long-lived token is needed. Requires npm >= 11.5.1 / Node >= 22.14 and
    # a Trusted Publisher on npmjs.com (orchstep / orchstep / publish-packages.yml).
    # Provenance attestations are generated automatically for this public repo.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: Update version from release tag
        working-directory: npm
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version $VERSION --no-git-tag-version --allow-same-version
      - name: Publish
        working-directory: npm
        run: npm publish --access public
        env:
          # Transition fallback: npm tries OIDC first and falls back to this token.
          # Remove once a release has published via OIDC (log shows a provenance
          # statement), then set npm "Publishing access" to disallow tokens.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pip:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install build twine
      - name: Update version from release tag
        working-directory: pip
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/version = .*/version = \"$VERSION\"/" pyproject.toml
      - name: Build
        working-directory: pip
        run: python -m build --sdist --wheel
      - name: Publish
        working-directory: pip
        run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
